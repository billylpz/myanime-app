<!-- 
  Estructura Skeleton para la tarjeta de planeta.
  Aplica la animación 'animate-pulse' de Tailwind CSS para indicar el estado de carga.
-->
<div class="card sm:card-side shadow-lg mb-10 bg-gray-200 dark:bg-slate-800 animate-pulse">
  
  <!-- Skeleton para la imagen del planeta -->
  <figure>
    <div class="size-100 bg-slate-300 dark:bg-slate-700"></div>
  </figure>

  <!-- Skeleton del cuerpo de la tarjeta -->
  <div class="card-body w-full sm:w-100 space-y-4">
    
    <!-- Skeletons para las propiedades del planeta -->
    <div class="space-y-3">
      <div class="h-6 bg-slate-300 dark:bg-slate-700 rounded w-1/3"></div>
      <div class="h-4 bg-slate-300 dark:bg-slate-700 rounded w-2/3 mb-4"></div>

      <div class="h-6 bg-slate-300 dark:bg-slate-700 rounded w-1/4"></div>
      <div class="h-4 bg-slate-300 dark:bg-slate-700 rounded w-1/2 mb-4"></div>

      <div class="h-6 bg-slate-300 dark:bg-slate-700 rounded w-1/3"></div>
      <div class="h-16 bg-slate-300 dark:bg-slate-700 rounded w-full"></div>
    </div>

    <!-- Skeleton del botón de acción (Characters) -->
    <div class="card-actions justify-end mt-10">
      <div class="h-10 w-28 bg-slate-300 dark:bg-slate-700 rounded-lg"></div>
    </div>

  </div>

</div>
