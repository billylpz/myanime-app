<div class="card card-side my-5 shadow-xl shadow-slate-500 dark:shadow-slate-800 
  bg-gray-200 text-black dark:text-white dark:bg-linear-to-b from-slate-900 to-slate-700
  md:h-180 animate-pulse">

  <!-- Imagen Skeleton para pantallas grandes (XL) -->
  <figure class="w-80 h-full hidden xl:block bg-gray-300 dark:bg-slate-700">
    <div class="w-full h-full"></div>
  </figure>

  <div class="card-body w-full flex flex-col">
    <div class="flex-1 overflow-auto space-y-4">

      <!-- Título Skeleton (simula el h2 text-4xl) -->
      <div class="h-9 bg-gray-300 dark:bg-slate-700 rounded-lg w-1/2"></div>

      <!-- Imagen Skeleton para móviles y pantallas medianas (< XL) -->
      <div class="flex justify-center xl:hidden my-4">
        <div class="w-40 h-90 bg-gray-300 dark:bg-slate-700 rounded-xl"></div>
      </div>

      <!-- Propiedades Skeleton (simula las iteraciones del @for) -->
      <div class="mt-5 space-y-6">
        <div class="h-5 bg-gray-300 dark:bg-slate-700 rounded w-3/4"></div>
        <div class="h-5 bg-gray-300 dark:bg-slate-700 rounded w-1/2"></div>
        <div class="h-5 bg-gray-300 dark:bg-slate-700 rounded w-2/3"></div>
        <div class="h-5 bg-gray-300 dark:bg-slate-700 rounded w-3/5"></div>
        <div class="h-5 bg-gray-300 dark:bg-slate-700 rounded w-4/5"></div>
      </div>

    </div>

    <!-- Acciones / Botón Details Skeleton -->
    <div class="card-actions justify-end mt-5">
      <div class="h-12 w-28 bg-gray-300 dark:bg-slate-700 rounded-xl"></div>
    </div>
  </div>
</div>
