<!-- Open the modal using ID.showModal() method -->
<dialog #modal class="modal modal-middle sm:modal-middle" (close)="closeModal()">
  <div class="modal-box bg-gray-200 dark:bg-slate-800">

    @if(planetResource.isLoading()){
    <!-- Planet INFO Skeleton -->
    <div class="flex flex-col gap-5 animate-pulse">
      <header class="flex justify-center">
        <div class="bg-gray-700 rounded-sm w-3/4 h-8"></div>
      </header>

      <div class="flex items-center bg-gray-700 rounded-sm w-full h-50"></div>
      <div class="flex items-center bg-gray-700 rounded-sm w-full h-50"></div>

    </div>
    }
    @else {
    <!-- Planet INFO -->
    <div>
      <div class="mb-15">
        <h3 class="text-lg sm:text-2xl flex justify-center">Characters of planet:
          <span class="font-bold text-red-400 pl-2">{{planetResource.value()?.name}}</span>
        </h3>
        <hr>
      </div>

      @for (planetCharacters of planetCharacters(); track planetCharacters) {

      <div class="flex row items-center mb-5">
        <p class="flex justify-center text-2xl text-blue-600 dark:text-green-400">{{planetCharacters.name}}</p>
        <img [src]="planetCharacters.image" class="h-50 w-30">
      </div>

      }@empty{
      <p class="text-red-500">Unknown</p>
      }
    </div>
    }

    <!-- buttons -->
    <div class="modal-action">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="closeModal()">✕</button>
      <button class="btn  hover:text-red-400" (click)="closeModal()">Close</button>
    </div>
  </div>
</dialog>
