<div class="flex flex-col min-h-screen">

  <app-tittle [title]="title" />
  <dbz-menuButtons />

  @if (dbzResource.isLoading()){
  <loading-spinner />
  }
  @else{
  <paginator [currentPage]="paginationService.currentPage()" [totalPages]="totalPages()" />

  <!-- TABLA -->
  <div class="grid grid-cols-1 gap-5  
     sm:grid-cols-2
     md:grid-cols-2
     lg:grid-cols-2">
    @for (character of characters(); track character.id) {
    <dbz-character-card [character]="character" />
    }
  </div>

  <paginator [currentPage]="paginationService.currentPage()" [totalPages]="totalPages()" />

  }
</div>
